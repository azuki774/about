name: Batch Check

on:
  pull_request:
    paths:
      - 'batch/**'
      - '.github/workflows/batch-check.yml'

jobs:
  batch-check:
    name: Batch Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Run batch tests
        working-directory: batch
        run: bun test

  batch-docker-build:
    name: Batch Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build batch Docker image
        run: docker build -t about-paravi-sync:test batch
